<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>秒 · SECONDS</title>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="clockbox">
      <div id="clock">0.0</div>
      <div id="breakdown">
        <span class="cPlay">游戏 <b id="bPlay">0.0</b></span> &nbsp;
        <span class="cPen">受击 <b id="bPen">0.0</b></span> &nbsp;
        <span class="cSpend">消费 <b id="bSpend">0.0</b></span> &nbsp;
        <span class="cRef">返还 <b id="bRef">0.0</b></span>
        <span id="bTax"></span>
      </div>
    </div>
    <div id="rightbox">
      <div id="nodeinfo">第 1 层 / 8</div>
      <div id="seedinfo">SEED —</div>
      <div id="upglist"></div>
    </div>
  </div>

  <div id="ov"><div id="ovinner"></div></div>
  <div id="toast"></div>
  <div id="help">WASD 移动 · 鼠标瞄准 · 左键挥砍 · 空格/右键 朝光标冲刺(无敌) · 数字键选卡 · ESC 暂停</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
