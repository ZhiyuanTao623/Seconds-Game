<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>秒 · SECONDS</title>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="clockbox">
      <div id="clock">0.0</div>
      <div id="breakdown">
        <span class="cPlay"><span id="lblPlay"></span> <b id="bPlay">0.0</b></span> &nbsp;
        <span class="cPen"><span id="lblPen"></span> <b id="bPen">0.0</b></span> &nbsp;
        <span class="cSpend"><span id="lblSpend"></span> <b id="bSpend">0.0</b></span> &nbsp;
        <span class="cRef"><span id="lblRef"></span> <b id="bRef">0.0</b></span>
        <span id="bTax"></span>
      </div>
      <div id="chesthud">
        <div><strong id="chesttitle"></strong> <span id="chesttime"></span></div>
        <small id="chestdetail"></small>
      </div>
    </div>
    <div id="rightbox">
      <div id="nodeinfo"></div>
      <div id="seedinfo"></div>
      <div id="moduleinfo"></div>
      <div id="upglist"></div>
    </div>
  </div>

  <div id="ov"><div id="ovinner"></div></div>
  <div id="toast"></div>
  <div id="help"></div>
  <div id="langToggle">EN</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
